<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#101733"/>
      <stop offset="100%" stop-color="#070912"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8ff6ee"/>
      <stop offset="55%" stop-color="#38e1d6"/>
      <stop offset="100%" stop-color="#1aa79c"/>
    </radialGradient>
  </defs>
  <!-- full-bleed background keeps maskable crops clean -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- orbital shells, inset to sit inside the maskable safe zone -->
  <g transform="translate(256 256) scale(0.78)" fill="none" stroke="#ff5fa2" stroke-width="14" opacity="0.9">
    <ellipse rx="196" ry="80"/>
    <ellipse rx="196" ry="80" transform="rotate(60)"/>
    <ellipse rx="196" ry="80" transform="rotate(120)"/>
  </g>
  <!-- qubit core -->
  <circle cx="256" cy="256" r="66" fill="url(#core)"/>
  <circle cx="256" cy="256" r="66" fill="none" stroke="#eafffb" stroke-width="3" opacity="0.5"/>
</svg>
